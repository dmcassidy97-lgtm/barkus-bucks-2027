<svg viewBox="0 0 320 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Line-art Doberman mascot wearing a red and white Sydney Swans-style jersey">
  <defs>
    <style>
      .db-line { fill: none; stroke: #241f19; stroke-width: 6; stroke-linejoin: round; stroke-linecap: round; }
      .db-body { fill: #2b241c; }
      .db-tan { fill: #c9793a; }
      .db-jersey { fill: #d1291c; }
      .db-white { fill: #ffffff; }
    </style>
  </defs>

  <!-- tail -->
  <path class="db-line" d="M 245 250 Q 275 240 270 215" fill="none"/>

  <!-- back legs -->
  <rect class="db-body" x="205" y="270" width="22" height="70" rx="8"/>
  <rect class="db-tan" x="205" y="322" width="22" height="18" rx="6"/>
  <rect class="db-body" x="238" y="270" width="22" height="70" rx="8"/>
  <rect class="db-tan" x="238" y="322" width="22" height="18" rx="6"/>

  <!-- body -->
  <rect class="db-body" x="120" y="190" width="150" height="110" rx="34"/>

  <!-- front legs -->
  <rect class="db-body" x="130" y="260" width="22" height="80" rx="8"/>
  <rect class="db-tan" x="130" y="322" width="22" height="18" rx="6"/>
  <rect class="db-body" x="163" y="260" width="22" height="80" rx="8"/>
  <rect class="db-tan" x="163" y="322" width="22" height="18" rx="6"/>

  <!-- jersey (over torso) -->
  <path class="db-jersey" d="M 128 196 L 260 196 Q 268 196 268 214 L 268 268 Q 200 288 130 268 L 130 214 Q 130 196 128 196 Z"/>
  <path class="db-white" d="M 130 200 L 175 268 L 152 268 L 128 214 Q 128 202 130 200 Z"/>
  <path class="db-white" d="M 266 200 L 222 268 L 245 268 L 268 214 Q 268 202 266 200 Z"/>
  <circle class="db-white" cx="199" cy="230" r="16"/>
  <text x="199" y="237" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700" fill="#d1291c" text-anchor="middle">10</text>

  <!-- neck / head -->
  <ellipse class="db-body" cx="120" cy="150" rx="52" ry="56"/>

  <!-- ears -->
  <path class="db-body" d="M 78 108 L 60 40 L 108 92 Z"/>
  <path class="db-body" d="M 160 108 L 182 40 L 132 92 Z"/>

  <!-- tan eyebrow marks + muzzle -->
  <circle class="db-tan" cx="98" cy="132" r="6"/>
  <circle class="db-tan" cx="142" cy="132" r="6"/>
  <path class="db-tan" d="M 82 158 Q 120 190 158 158 Q 150 182 120 186 Q 90 182 82 158 Z"/>

  <!-- snout -->
  <ellipse class="db-body" cx="120" cy="172" rx="30" ry="20"/>
  <ellipse fill="#150f0a" cx="120" cy="168" rx="9" ry="7"/>

  <!-- eyes -->
  <circle fill="#150f0a" cx="100" cy="140" r="5"/>
  <circle fill="#150f0a" cx="140" cy="140" r="5"/>
</svg>
