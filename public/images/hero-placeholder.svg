<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Light gradient hero art with a Doberman mascot in a red and white jersey and a scattered party-icon pattern">
  <defs>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ff5a2c" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ff5a2c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffb648" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffb648" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f5f1" stop-opacity="0"/>
      <stop offset="100%" stop-color="#f7f5f1" stop-opacity="1"/>
    </linearGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="70"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="50"/></filter>

    <!-- scattered party-icon texture: beer, cocktail, bong, cream dispenser, paw -->
    <pattern id="litter" width="240" height="240" patternUnits="userSpaceOnUse" patternTransform="rotate(8)">
      <g fill="#241f19">
        <!-- paw -->
        <g transform="translate(30,26)">
          <ellipse cx="0" cy="16" rx="10" ry="8"/>
          <ellipse cx="-9" cy="0" rx="4" ry="5" transform="rotate(-15)"/>
          <ellipse cx="0" cy="-5" rx="4" ry="5"/>
          <ellipse cx="9" cy="0" rx="4" ry="5" transform="rotate(15)"/>
        </g>
        <!-- beer mug -->
        <g transform="translate(160,50) rotate(-6)">
          <path d="M -12 -14 H 10 V 14 a4 4 0 0 1 -4 4 H -8 a4 4 0 0 1 -4 -4 Z"/>
          <path d="M 10 -6 a9 9 0 0 1 0 18 h -3 v -18 Z"/>
        </g>
        <!-- cocktail -->
        <g transform="translate(60,140) rotate(4)">
          <path d="M -14 -14 H 14 L 0 6 Z"/>
          <rect x="-2" y="6" width="4" height="16"/>
          <rect x="-10" y="22" width="20" height="4" rx="2"/>
        </g>
        <!-- bong -->
        <g transform="translate(180,170) rotate(-10)">
          <path d="M -6 -20 h 5 v 26 h 10 v -26 h 5 v 26 a 11 11 0 0 1 -20 0 Z"/>
          <path d="M 9 -4 L 24 -12"/>
          <circle cx="27" cy="-14" r="4"/>
        </g>
        <!-- cream dispenser -->
        <g transform="translate(115,95) rotate(10)">
          <rect x="-9" y="-6" width="18" height="30" rx="6"/>
          <rect x="-4" y="-16" width="8" height="10" rx="2"/>
          <rect x="9" y="-12" width="14" height="8" rx="3"/>
        </g>
      </g>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#f7f5f1"/>

  <!-- soft glow blobs -->
  <circle cx="850" cy="240" r="440" fill="url(#glow1)" filter="url(#blur1)"/>
  <circle cx="1250" cy="470" r="280" fill="url(#glow2)" filter="url(#blur2)"/>

  <!-- scattered party-icon texture -->
  <rect width="1600" height="900" fill="url(#litter)" opacity="0.05"/>

  <!-- faint grid -->
  <g stroke="#000000" stroke-opacity="0.035" stroke-width="1">
    <line x1="0" y1="150" x2="1600" y2="150"/>
    <line x1="0" y1="300" x2="1600" y2="300"/>
    <line x1="0" y1="450" x2="1600" y2="450"/>
    <line x1="0" y1="600" x2="1600" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="900"/>
    <line x1="500" y1="0" x2="500" y2="900"/>
    <line x1="800" y1="0" x2="800" y2="900"/>
    <line x1="1100" y1="0" x2="1100" y2="900"/>
    <line x1="1400" y1="0" x2="1400" y2="900"/>
  </g>

  <!-- minimal skyline silhouette, single warm charcoal tone -->
  <g fill="#3a332c" opacity="0.85">
    <rect x="0" y="640" width="90" height="260"/>
    <rect x="100" y="600" width="60" height="300"/>
    <rect x="175" y="660" width="110" height="240"/>
    <rect x="300" y="560" width="70" height="340"/>
    <polygon points="700,900 700,470 745,420 810,400 875,420 920,470 920,900" fill="#2e281f"/>
    <rect x="1360" y="620" width="80" height="280"/>
    <rect x="1455" y="580" width="65" height="320"/>
    <rect x="1530" y="650" width="70" height="250"/>
  </g>

  <!-- warm accent windows on central tower -->
  <g fill="#ff5a2c" opacity="0.6">
    <rect x="730" y="460" width="10" height="14"/>
    <rect x="760" y="460" width="10" height="14"/>
    <rect x="790" y="460" width="10" height="14"/>
    <rect x="820" y="460" width="10" height="14"/>
    <rect x="850" y="460" width="10" height="14"/>
    <rect x="880" y="460" width="10" height="14"/>
    <rect x="745" y="520" width="10" height="14"/>
    <rect x="805" y="520" width="10" height="14"/>
    <rect x="865" y="520" width="10" height="14"/>
  </g>
</svg>
