      <stop offset="0%" stop-color="#ffb648" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffb648" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0d" stop-opacity="0"/>
